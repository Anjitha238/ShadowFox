<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* General Styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /* Header Style */
        #header {
            background-color: #ff4081;
            padding: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #header .logo {
            width: 150px;
            cursor: pointer;
        }

        #navbar {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        #navbar li {
            display: inline;
        }

        #navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        #navbar .active {
            color: #ffeb3b;
        }

        /* Page Header */
        #page-header {
            background: #ff4081;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        #page-header h2 {
            font-size: 40px;
        }

        #page-header p {
            font-size: 18px;
            margin-top: 10px;
        }

        /* About Section */
        #about-head {
            display: flex;
            justify-content: space-between;
            padding: 50px 10%;
            background-color: white;
            margin-top: 30px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        #about-head img {
            width: 45%;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .about-content {
            width: 50%;
        }

        .about-content h2 {
            color: #ff4081;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .about-content p {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
        }

        /* Call to Action - App Section */
        #about-app {
            background-color: #ffeb3b;
            text-align: center;
            padding: 40px 20px;
            margin-top: 30px;
        }

        #about-app h1 {
            font-size: 30px;
            color: #333;
            margin-bottom: 20px;
        }

        #about-app a {
            color: #3f51b5;
            font-weight: bold;
            text-decoration: none;
        }

        /* Footer Section */
        footer {
            background-color: #333;
            color: white;
            padding: 50px 0;
            margin-top: 30px;
        }

        footer .col {
            margin-bottom: 20px;
            padding: 0 15px;
            color: white;
        }

        footer h4 {
            font-size: 18px;
            margin-bottom: 15px;
            color: white;
        }

        footer .follow .icon i {
            font-size: 20px;
            margin-right: 15px;
            color: white;
        }

        footer .icon i:hover {
            color: #ff4081;
        }

        footer .col a {
            color: white;
            text-decoration: none;
            display: block;
            margin-bottom: 10px;
        }

        footer .col a:hover {
            color: #ffeb3b;
        }

        footer .copyright {
            text-align: center;
            font-size: 14px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <section class="section-p1">
        <form id="checkoutForm">
            <h2>Billing Details</h2>
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="text" placeholder="Shipping Address" required>
            <button type="submit" class="btn">Place Order</button>
        </form>
    </section>
    <script src="script.js"></script>
</body>
</html>
